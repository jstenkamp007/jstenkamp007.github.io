<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Apotheke am Stadtpark – Verwaltung
</title>


<style>

/* =====================================================
   GRUNDLAGEN
===================================================== */

:root {

    --blue: #102a43;
    --green: #15966f;
    --light: #f5f7f8;
    --muted: #627d98;

}

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: var(--light);

    color: var(--blue);

}


/* =====================================================
   HEADER
===================================================== */

header {

    background: white;

    padding:
        20px 24px;

    border-bottom:
        1px solid #e5eaed;

    display: flex;

    justify-content: space-between;

    align-items: center;

}

.logo {

    font-weight: 700;

    font-size: 18px;

}

.logout {

    border: none;

    background: #f1f3f4;

    color: var(--blue);

    padding: 10px 16px;

    border-radius: 12px;

    cursor: pointer;

    font-size: 14px;

    transition:
        transform 0.2s ease,
        background 0.2s ease;

}

.logout:hover {

    transform: scale(1.03);

    background: #e8ecef;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    max-width: 900px;

    margin: 0 auto;

    padding: 40px 20px;

}

h1 {

    margin-top: 0;

    margin-bottom: 8px;

}

.subtitle {

    color: var(--muted);

    margin-bottom: 30px;

}


/* =====================================================
   LOGIN
===================================================== */

.login-box {

    max-width: 430px;

    margin:
        80px auto;

    background: white;

    padding: 32px;

    border-radius: 24px;

    box-shadow:
        0 15px 40px
        rgba(16,42,67,0.08);

}

.form-group {

    margin-bottom: 18px;

}

label {

    display: block;

    margin-bottom: 7px;

    font-weight: 600;

}

input {

    width: 100%;

    padding: 14px;

    border: 1px solid #dce3e7;

    border-radius: 12px;

    font-size: 15px;

    font-family: inherit;

    outline: none;

}

input:focus {

    border-color: var(--green);

    box-shadow:
        0 0 0 3px
        rgba(21,150,111,0.10);

}

button.primary {

    width: 100%;

    border: none;

    background: var(--green);

    color: white;

    padding: 14px;

    border-radius: 12px;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

}

button.primary:hover {

    transform: translateY(-1px);

    box-shadow:
        0 8px 20px
        rgba(21,150,111,0.20);

}


/* =====================================================
   SUCHE & FILTER
===================================================== */

.order-filters {

    display: flex;

    gap: 12px;

    margin-bottom: 25px;

    flex-wrap: wrap;

}

.order-filters input,
.order-filters select {

    padding: 14px 16px;

    border: 1px solid #dce3e7;

    border-radius: 14px;

    background: white;

    color: var(--blue);

    font-family: inherit;

    font-size: 15px;

    outline: none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;

}

.order-filters input {

    flex: 1;

    min-width: 240px;

}

.order-filters select {

    min-width: 170px;

    cursor: pointer;

}

.order-filters input:focus,
.order-filters select:focus {

    border-color: var(--green);

    box-shadow:
        0 0 0 3px
        rgba(21,150,111,0.10);

}

.order-filters input:hover,
.order-filters select:hover {

    transform: translateY(-1px);

}


/* =====================================================
   DASHBOARD
===================================================== */

.dashboard {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 15px;

    margin-bottom: 35px;

}

.stat-card {

    background: white;

    padding: 22px;

    border-radius: 20px;

    box-shadow:
        0 8px 25px
        rgba(16,42,67,0.06);

}

.stat-number {

    font-size: 30px;

    font-weight: 700;

}

.stat-label {

    margin-top: 6px;

    color: var(--muted);

    font-size: 14px;

}


/* =====================================================
   ORDER CARD
===================================================== */

.order-card {

    background: white;

    padding: 22px;

    margin-bottom: 15px;

    border-radius: 20px;

    box-shadow:
        0 8px 25px
        rgba(16,42,67,0.06);

}

.order-header {

    display: flex;

    justify-content: space-between;

    gap: 15px;

}

.order-name {

    font-size: 18px;

    font-weight: 700;

}

.order-date {

    color: var(--muted);

    font-size: 13px;

}

.order-medicine {

    margin-top: 12px;

    font-weight: 600;

    color: var(--green);

}

.order-details {

    margin-top: 15px;

    color: var(--muted);

    line-height: 1.6;

}

.order-status {

    margin-top: 18px;

    padding-top: 15px;

    border-top:
        1px solid #eef1f3;

}

.status-buttons {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 15px;

}

.status-buttons button {

    border: none;

    background: #f1f3f4;

    color: var(--blue);

    padding: 9px 12px;

    border-radius: 10px;

    cursor: pointer;

    font-family: inherit;

    font-size: 13px;

    transition:
        transform 0.2s ease,
        background 0.2s ease;

}

.status-buttons button:hover {

    transform: translateY(-1px);

    background: #e5e9eb;

}


/* =====================================================
   FEHLER / LEER
===================================================== */

.error {

    color: #b42318;

    margin-top: 15px;

}

.empty {

    text-align: center;

    padding: 50px 20px;

    color: var(--muted);

    background: white;

    border-radius: 20px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px) {

    .order-header {

        flex-direction: column;

    }


    .dashboard {

        grid-template-columns:
            repeat(2, 1fr);

    }


    .stat-card {

        padding: 18px;

    }


    .stat-number {

        font-size: 26px;

    }


    .order-filters {

        flex-direction: column;

    }


    .order-filters input,
    .order-filters select {

        width: 100%;

        min-width: 0;

    }


    .status-buttons {

        flex-direction: column;

    }


    .status-buttons button {

        width: 100%;

    }

}

</style>

</head>


<body>


<header>

    <div class="logo">

        Apotheke am Stadtpark

    </div>


    <button
        class="logout"
        id="logoutButton"
        style="display:none;"
    >

        Abmelden

    </button>

</header>



<!-- =====================================================
     LOGIN
===================================================== -->

<section
    id="loginSection"
    class="login-box"
>

    <h1>
        Apotheken-Verwaltung
    </h1>

    <p>
        Bitte anmelden, um Vorbestellungen
        anzuzeigen.
    </p>


    <form id="loginForm">


        <div class="form-group">

            <label for="email">
                E-Mail
            </label>

            <input
                type="email"
                id="email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Passwort
            </label>

            <input
                type="password"
                id="password"
                required
            >

        </div>


        <button
            class="primary"
            type="submit"
        >

            Anmelden

        </button>


        <div
            id="loginError"
            class="error"
        ></div>


    </form>

</section>



<!-- =====================================================
     ADMIN
===================================================== -->

<main
    id="adminSection"
    class="container"
    style="display:none;"
>

    <h1>
        Vorbestellungen
    </h1>

    <p class="subtitle">
        Eingegangene Anfragen
    </p>


    <!-- =================================================
         SUCHE & FILTER
    ================================================= -->

    <div class="order-filters">

        <input
            type="text"
            id="orderSearch"
            placeholder="🔍 Name, Medikament oder Telefon suchen..."
        >


        <select id="statusFilter">

            <option value="all">
                Alle Status
            </option>

            <option value="new">
                🔴 Neu
            </option>

            <option value="processing">
                🟡 In Bearbeitung
            </option>

            <option value="ready">
                🟢 Abholbereit
            </option>

            <option value="completed">
                ⚪ Erledigt
            </option>

        </select>

    </div>



    <!-- =================================================
         DASHBOARD
    ================================================= -->

    <div class="dashboard">

        <div class="stat-card">

            <div
                class="stat-number"
                id="newCount"
            >
                0
            </div>

            <div class="stat-label">
                🔴 Neu
            </div>

        </div>


        <div class="stat-card">

            <div
                class="stat-number"
                id="processingCount"
            >
                0
            </div>

            <div class="stat-label">
                🟡 In Bearbeitung
            </div>

        </div>


        <div class="stat-card">

            <div
                class="stat-number"
                id="readyCount"
            >
                0
            </div>

            <div class="stat-label">
                🟢 Abholbereit
            </div>

        </div>


        <div class="stat-card">

            <div
                class="stat-number"
                id="totalCount"
            >
                0
            </div>

            <div class="stat-label">
                📋 Gesamt
            </div>

        </div>

    </div>



    <!-- =================================================
         BESTELLUNGEN
    ================================================= -->

    <div id="orders">

    </div>

</main>



<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://iezjojbuyzugfguhizyw.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_M-EP4v8yBM092Lkgau701Q_EISGyFfe";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =====================================================
   ELEMENTE
===================================================== */

const loginForm =
    document.getElementById("loginForm");

const loginSection =
    document.getElementById("loginSection");

const adminSection =
    document.getElementById("adminSection");

const loginError =
    document.getElementById("loginError");

const logoutButton =
    document.getElementById("logoutButton");

const ordersContainer =
    document.getElementById("orders");

const orderSearch =
    document.getElementById("orderSearch");

const statusFilter =
    document.getElementById("statusFilter");

const newCount =
    document.getElementById("newCount");

const processingCount =
    document.getElementById("processingCount");

const readyCount =
    document.getElementById("readyCount");

const totalCount =
    document.getElementById("totalCount");


let allOrders = [];

let realtimeChannel = null;



/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        loginError.textContent = "";


        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        const {
            error
        } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


        if (error) {

            loginError.textContent =
                "E-Mail oder Passwort ist falsch.";

            console.error(error);

            return;

        }


        await showAdmin();

    }
);



/* =====================================================
   ADMIN ANZEIGEN
===================================================== */

async function showAdmin() {

    loginSection.style.display =
        "none";

    adminSection.style.display =
        "block";

    logoutButton.style.display =
        "block";


    await loadOrders();

    startRealtime();

}



/* =====================================================
   BESTELLUNGEN LADEN
===================================================== */

async function loadOrders() {

    ordersContainer.innerHTML =
        "<p>Vorbestellungen werden geladen ...";


    const {
        data,
        error
    } =
    await supabaseClient
        .from("orders")
        .select("*")
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        ordersContainer.innerHTML = `

            <div class="error">

                Fehler beim Laden der
                Vorbestellungen.

            </div>

        `;

        return;

    }


    allOrders =
        data || [];


    updateDashboardCounts();

    renderOrders();

}



/* =====================================================
   DASHBOARD ZAHLEN
===================================================== */

function updateDashboardCounts() {

    const newOrders =
        allOrders.filter(
            order =>
                order.status === "new"
        ).length;


    const processingOrders =
        allOrders.filter(
            order =>
                order.status === "processing"
        ).length;


    const readyOrders =
        allOrders.filter(
            order =>
                order.status === "ready"
        ).length;


    const totalOrders =
        allOrders.length;


    newCount.textContent =
        newOrders;


    processingCount.textContent =
        processingOrders;


    readyCount.textContent =
        readyOrders;


    totalCount.textContent =
        totalOrders;

}



/* =====================================================
   BESTELLUNGEN DARSTELLEN
===================================================== */

function renderOrders() {

    const searchTerm =
        orderSearch.value
            .toLowerCase()
            .trim();


    const selectedStatus =
        statusFilter.value;


    const filteredOrders =
        allOrders.filter(
            function(order) {


                const fullText = `

                    ${order.first_name || ""}

                    ${order.last_name || ""}

                    ${order.medicine || ""}

                    ${order.phone || ""}

                `.toLowerCase();


                const matchesSearch =
                    fullText.includes(
                        searchTerm
                    );


                const matchesStatus =
                    selectedStatus === "all"
                    ||
                    order.status === selectedStatus;


                return (
                    matchesSearch
                    &&
                    matchesStatus
                );

            }
        );


    if (filteredOrders.length === 0) {

        ordersContainer.innerHTML = `

            <div class="empty">

                ${
                    allOrders.length === 0
                    ? "Keine Vorbestellungen vorhanden."
                    : "Keine passenden Vorbestellungen gefunden."
                }

            </div>

        `;

        return;

    }


    ordersContainer.innerHTML = "";


    filteredOrders.forEach(
        function(order) {


            const date =
                order.created_at
                ? new Date(
                    order.created_at
                  ).toLocaleString(
                    "de-DE"
                  )
                : "Zeitpunkt unbekannt";


            const card =
                document.createElement("div");


            card.className =
                "order-card";


            card.innerHTML = `

                <div class="order-header">

                    <div class="order-name">

                        ${escapeHtml(
                            order.first_name
                        )}

                        ${escapeHtml(
                            order.last_name
                        )}

                    </div>


                    <div class="order-date">

                        ${date}

                    </div>

                </div>


                <div class="order-medicine">

                    💊

                    ${escapeHtml(
                        order.medicine
                    )}

                </div>


                <div class="order-details">

                    📞

                    ${escapeHtml(
                        order.phone
                    )}

                    <br>


                    📝

                    ${escapeHtml(
                        order.message ||
                        "Keine Nachricht"
                    )}

                    <br>


                    📱 Rückruf:

                    ${
                        order.callback
                        ? "Ja"
                        : "Nein"
                    }

                </div>


                <div class="order-status">

                    <strong>
                        Status:
                    </strong>

                    <span>

                        ${getStatusLabel(
                            order.status
                        )}

                    </span>

                </div>


                <div class="status-buttons">

                    <button
                        type="button"
                        onclick="updateOrderStatus(
                            ${order.id},
                            'new'
                        )"
                    >
                        Neu
                    </button>


                    <button
                        type="button"
                        onclick="updateOrderStatus(
                            ${order.id},
                            'processing'
                        )"
                    >
                        In Bearbeitung
                    </button>


                    <button
                        type="button"
                        onclick="updateOrderStatus(
                            ${order.id},
                            'ready'
                        )"
                    >
                        Abholbereit
                    </button>


                    <button
                        type="button"
                        onclick="updateOrderStatus(
                            ${order.id},
                            'completed'
                        )"
                    >
                        Erledigt
                    </button>

                </div>

            `;


            ordersContainer.appendChild(
                card
            );

        }
    );

}



/* =====================================================
   SICHERHEIT
===================================================== */

function escapeHtml(value) {

    const div =
        document.createElement("div");


    div.textContent =
        value ?? "";


    return div.innerHTML;

}



/* =====================================================
   STATUS ANZEIGEN
===================================================== */

function getStatusLabel(status) {

    if (status === "new") {

        return "🔴 Neu";

    }


    if (status === "processing") {

        return "🟡 In Bearbeitung";

    }


    if (status === "ready") {

        return "🟢 Abholbereit";

    }


    if (status === "completed") {

        return "⚪ Erledigt";

    }


    return "Unbekannt";

}



/* =====================================================
   STATUS ÄNDERN
===================================================== */

async function updateOrderStatus(
    orderId,
    newStatus
) {

    const {
        error
    } =
    await supabaseClient
        .from("orders")
        .update({

            status: newStatus

        })
        .eq(
            "id",
            orderId
        );


    if (error) {

        console.error(error);

        alert(
            "Der Status konnte nicht geändert werden."
        );

        return;

    }


    await loadOrders();

}



/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
    "click",
    async function() {


        if (realtimeChannel) {

            await supabaseClient.removeChannel(
                realtimeChannel
            );

            realtimeChannel = null;

        }


        await supabaseClient.auth.signOut();


        allOrders = [];


        adminSection.style.display =
            "none";


        loginSection.style.display =
            "block";


        logoutButton.style.display =
            "none";


        ordersContainer.innerHTML =
            "";


        orderSearch.value =
            "";


        statusFilter.value =
            "all";


        updateDashboardCounts();

    }
);



/* =====================================================
   BESTEHENDE SESSION PRÜFEN
===================================================== */

async function checkSession() {

    const {
        data
    } =
    await supabaseClient.auth.getUser();


    if (data.user) {

        await showAdmin();

    }

}


checkSession();



/* =====================================================
   SUPABASE REALTIME
===================================================== */

function startRealtime() {

    if (realtimeChannel) {

        return;

    }


    realtimeChannel =
        supabaseClient
            .channel("orders-realtime")

            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "orders"
                },

                function(payload) {

                    console.log(
                        "Neue Vorbestellung:",
                        payload.new
                    );


                    loadOrders();


                    showNewOrderNotification(
                        payload.new
                    );

                }
            )

            .subscribe(
                function(status) {

                    console.log(
                        "Realtime Status:",
                        status
                    );

                }
            );

}



/* =====================================================
   NEUE VORBESTELLUNG BENACHRICHTIGUNG
===================================================== */

function showNewOrderNotification(order) {

    const notification =
        document.createElement("div");


    notification.style.position =
        "fixed";

    notification.style.top =
        "20px";

    notification.style.right =
        "20px";

    notification.style.zIndex =
        "9999";

    notification.style.background =
        "white";

    notification.style.color =
        "#102a43";

    notification.style.padding =
        "18px 22px";

    notification.style.borderRadius =
        "18px";

    notification.style.boxShadow =
        "0 15px 40px rgba(0,0,0,0.15)";

    notification.innerHTML = `

        <strong>
            🔴 Neue Vorbestellung
        </strong>

        <br>

        <span>

            ${escapeHtml(
                order.first_name
            )}

            ${escapeHtml(
                order.last_name
            )}

        </span>

    `;


    document.body.appendChild(
        notification
    );


    setTimeout(
        function() {

            if (
                notification.parentNode
            ) {

                notification.remove();

            }

        },
        5000
    );

}



/* =====================================================
   SUCHE & FILTER
===================================================== */

orderSearch.addEventListener(
    "input",
    function() {

        renderOrders();

    }
);


statusFilter.addEventListener(
    "change",
    function() {

        renderOrders();

    }
);

</script>


</body>

</html>
