<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Apotheke am Stadtpark – Verwaltung
</title>


<style>

/* =====================================================
   GRUNDLAGEN
===================================================== */

:root {

    --blue: #102a43;
    --green: #15966f;
    --light: #f5f7f8;
    --muted: #627d98;

    --red: #d92d20;
    --yellow: #b7791f;
    --ready: #15966f;

}

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: var(--light);

    color: var(--blue);

}


/* =====================================================
   HEADER
===================================================== */

header {

    background: white;

    padding:
        20px 24px;

    border-bottom:
        1px solid #e5eaed;

    display: flex;

    justify-content: space-between;

    align-items: center;

    position: sticky;

    top: 0;

    z-index: 100;

}

.logo {

    font-weight: 700;

    font-size: 18px;

}

.header-actions {

    display: flex;

    align-items: center;

    gap: 10px;

}

.logout,
.refresh-button {

    border: none;

    background: #f1f3f4;

    color: var(--blue);

    padding: 10px 16px;

    border-radius: 12px;

    cursor: pointer;

    font-size: 14px;

    font-family: inherit;

    transition:
        transform 0.2s ease,
        background 0.2s ease;

}

.logout:hover,
.refresh-button:hover {

    transform: translateY(-1px);

    background: #e8ecef;

}

.refresh-button.loading {

    opacity: 0.6;

    pointer-events: none;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    max-width: 1000px;

    margin: 0 auto;

    padding: 40px 20px;

}

h1 {

    margin-top: 0;

    margin-bottom: 8px;

}

.subtitle {

    color: var(--muted);

    margin-bottom: 25px;

}


/* =====================================================
   LOGIN
===================================================== */

.login-box {

    max-width: 430px;

    margin:
        80px auto;

    background: white;

    padding: 32px;

    border-radius: 24px;

    box-shadow:
        0 15px 40px
        rgba(16,42,67,0.08);

}

.form-group {

    margin-bottom: 18px;

}

label {

    display: block;

    margin-bottom: 7px;

    font-weight: 600;

}

input {

    width: 100%;

    padding: 14px;

    border: 1px solid #dce3e7;

    border-radius: 12px;

    font-size: 15px;

    font-family: inherit;

    outline: none;

}

input:focus {

    border-color: var(--green);

    box-shadow:
        0 0 0 3px
        rgba(21,150,111,0.10);

}

button.primary {

    width: 100%;

    border: none;

    background: var(--green);

    color: white;

    padding: 14px;

    border-radius: 12px;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

}

button.primary:hover {

    transform: translateY(-1px);

    box-shadow:
        0 8px 20px
        rgba(21,150,111,0.20);

}

button.primary:disabled {

    opacity: 0.6;

    cursor: default;

    transform: none;

}


/* =====================================================
   ADMIN TOOLBAR
===================================================== */

.admin-toolbar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 20px;

    flex-wrap: wrap;

}

.last-updated {

    color: var(--muted);

    font-size: 13px;

}


/* =====================================================
   SUCHE & FILTER
===================================================== */

.order-filters {

    display: flex;

    gap: 12px;

    margin-bottom: 25px;

    flex-wrap: wrap;

}

.order-filters input,
.order-filters select {

    padding: 14px 16px;

    border: 1px solid #dce3e7;

    border-radius: 14px;

    background: white;

    color: var(--blue);

    font-family: inherit;

    font-size: 15px;

    outline: none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;

}

.order-filters input {

    flex: 1;

    min-width: 240px;

}

.order-filters select {

    min-width: 170px;

    cursor: pointer;

}

.order-filters input:focus,
.order-filters select:focus {

    border-color: var(--green);

    box-shadow:
        0 0 0 3px
        rgba(21,150,111,0.10);

}

.order-filters input:hover,
.order-filters select:hover {

    transform: translateY(-1px);

}


/* =====================================================
   DASHBOARD
===================================================== */

.dashboard {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;

    margin-bottom: 35px;

}

.stat-card {

    background: white;

    padding: 22px;

    border-radius: 20px;

    box-shadow:
        0 8px 25px
        rgba(16,42,67,0.06);

}

.stat-number {

    font-size: 30px;

    font-weight: 700;

}

.stat-label {

    margin-top: 6px;

    color: var(--muted);

    font-size: 14px;

}


/* =====================================================
   ORDER CARD
===================================================== */

.order-card {

    background: white;

    padding: 22px;

    margin-bottom: 15px;

    border-radius: 20px;

    box-shadow:
        0 8px 25px
        rgba(16,42,67,0.06);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

}

.order-card:hover {

    transform: translateY(-1px);

    box-shadow:
        0 12px 30px
        rgba(16,42,67,0.08);

}

.order-header {

    display: flex;

    justify-content: space-between;

    gap: 15px;

}

.order-name {

    font-size: 18px;

    font-weight: 700;

}

.order-date {

    color: var(--muted);

    font-size: 13px;

    text-align: right;

}

.order-medicine {

    margin-top: 12px;

    font-weight: 600;

    color: var(--green);

    font-size: 16px;

}

.order-details {

    margin-top: 15px;

    color: var(--muted);

    line-height: 1.7;

}

.order-details a {

    color: var(--blue);

    text-decoration: none;

    font-weight: 600;

}

.order-details a:hover {

    text-decoration: underline;

}

.order-message {

    margin-top: 6px;

    padding: 10px 12px;

    background: #f7f9fa;

    border-radius: 10px;

    white-space: pre-wrap;

    word-break: break-word;

}


/* =====================================================
   STATUS
===================================================== */

.order-status {

    margin-top: 18px;

    padding-top: 15px;

    border-top:
        1px solid #eef1f3;

    display: flex;

    align-items: center;

    gap: 8px;

    flex-wrap: wrap;

}

.status-label {

    font-weight: 600;

}

.status-buttons {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 15px;

}

.status-buttons button {

    border: none;

    background: #f1f3f4;

    color: var(--blue);

    padding: 10px 13px;

    border-radius: 10px;

    cursor: pointer;

    font-family: inherit;

    font-size: 13px;

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;

}

.status-buttons button:hover {

    transform: translateY(-1px);

    background: #e5e9eb;

}

.status-buttons button.active {

    background: var(--green);

    color: white;

    box-shadow:
        0 4px 12px
        rgba(21,150,111,0.20);

}

.status-buttons button:disabled {

    opacity: 0.55;

    cursor: default;

    transform: none;

}


/* =====================================================
   FEHLER / LEER / LADEN
===================================================== */

.error {

    color: #b42318;

    margin-top: 15px;

}

.empty {

    text-align: center;

    padding: 50px 20px;

    color: var(--muted);

    background: white;

    border-radius: 20px;

}

.loading {

    text-align: center;

    padding: 30px 20px;

    color: var(--muted);

    background: white;

    border-radius: 20px;

}


/* =====================================================
   BENACHRICHTIGUNG
===================================================== */

.notification {

    position: fixed;

    top: 20px;

    right: 20px;

    z-index: 9999;

    background: white;

    color: var(--blue);

    padding: 18px 22px;

    border-radius: 18px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,0.15);

    max-width: 340px;

    animation:
        notificationIn 0.25s ease;

}

.notification-title {

    font-weight: 700;

}

.notification-name {

    margin-top: 5px;

    color: var(--muted);

}

@keyframes notificationIn {

    from {

        opacity: 0;

        transform:
            translateY(-10px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =====================================================
   TOAST
===================================================== */

.toast {

    position: fixed;

    bottom: 20px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 10000;

    background: var(--blue);

    color: white;

    padding: 13px 18px;

    border-radius: 12px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.15);

    font-size: 14px;

    animation:
        toastIn 0.2s ease;

}

@keyframes toastIn {

    from {

        opacity: 0;

        transform:
            translate(-50%, 10px);

    }

    to {

        opacity: 1;

        transform:
            translate(-50%, 0);

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px) {

    header {

        padding:
            16px 18px;

    }

    .logo {

        font-size: 16px;

    }

    .container {

        padding:
            28px 15px;

    }

    .admin-toolbar {

        align-items: stretch;

        flex-direction: column;

    }

    .refresh-button {

        width: 100%;

    }

    .dashboard {

        grid-template-columns:
            repeat(2, 1fr);

    }

    .stat-card {

        padding: 18px;

    }

    .stat-number {

        font-size: 26px;

    }

    .order-header {

        flex-direction: column;

    }

    .order-date {

        text-align: left;

    }

    .order-filters {

        flex-direction: column;

    }

    .order-filters input,
    .order-filters select {

        width: 100%;

        min-width: 0;

    }

    .status-buttons {

        flex-direction: column;

    }

    .status-buttons button {

        width: 100%;

    }

    .notification {

        left: 15px;

        right: 15px;

        top: 15px;

        max-width: none;

    }

}


/* =====================================================
   SEHR KLEINE GERÄTE
===================================================== */

@media(max-width:380px) {

    .dashboard {

        grid-template-columns:
            1fr;

    }

}

</style>

</head>


<body>


<header>

    <div class="logo">

        Apotheke am Stadtpark

    </div>


    <div
        class="header-actions"
    >

        <button
            class="refresh-button"
            id="refreshButton"
            style="display:none;"
            type="button"
        >

            ↻ Aktualisieren

        </button>


        <button
            class="logout"
            id="logoutButton"
            style="display:none;"
            type="button"
        >

            Abmelden

        </button>

    </div>

</header>



<!-- =====================================================
     LOGIN
===================================================== -->

<section
    id="loginSection"
    class="login-box"
>

    <h1>
        Apotheken-Verwaltung
    </h1>

    <p>
        Bitte anmelden, um Vorbestellungen
        anzuzeigen.
    </p>


    <form id="loginForm">


        <div class="form-group">

            <label for="email">
                E-Mail
            </label>

            <input
                type="email"
                id="email"
                autocomplete="username"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Passwort
            </label>

            <input
                type="password"
                id="password"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            class="primary"
            id="loginButton"
            type="submit"
        >

            Anmelden

        </button>


        <div
            id="loginError"
            class="error"
        ></div>


    </form>

</section>



<!-- =====================================================
     ADMIN
===================================================== -->

<main
    id="adminSection"
    class="container"
    style="display:none;"
>

    <h1>
        Vorbestellungen
    </h1>

    <p class="subtitle">
        Eingegangene Anfragen
    </p>


    <!-- =================================================
         TOOLBAR
    ================================================= -->

    <div class="admin-toolbar">

        <div
            class="last-updated"
            id="lastUpdated"
        >
            Noch nicht aktualisiert
        </div>


        <button
            class="refresh-button"
            id="refreshButtonMobile"
            type="button"
        >

            ↻ Aktualisieren

        </button>

    </div>



    <!-- =================================================
         SUCHE & FILTER
    ================================================= -->

    <div class="order-filters">

        <input
            type="text"
            id="orderSearch"
            placeholder="🔍 Name, Medikament, Telefon oder Nachricht suchen..."
            autocomplete="off"
        >


        <select id="statusFilter">

            <option value="all">
                Alle Status
            </option>

            <option value="new">
                🔴 Neu
            </option>

            <option value="processing">
                🟡 In Bearbeitung
            </option>

            <option value="ready">
                🟢 Abholbereit
            </option>

            <option value="completed">
                ⚪ Erledigt
            </option>

        </select>


        <select id="dateFilter">

            <option value="all">
                Alle Zeiträume
            </option>

            <option value="today">
                Heute
            </option>

        </select>

    </div>



    <!-- =================================================
         DASHBOARD
    ================================================= -->

    <div class="dashboard">


        <div class="stat-card">

            <div
                class="stat-number"
                id="newCount"
            >
                0
            </div>

            <div class="stat-label">
                🔴 Neu
            </div>

        </div>


        <div class="stat-card">

            <div
                class="stat-number"
                id="processingCount"
            >
                0
            </div>

            <div class="stat-label">
                🟡 In Bearbeitung
            </div>

        </div>


        <div class="stat-card">

            <div
                class="stat-number"
                id="readyCount"
            >
                0
            </div>

            <div class="stat-label">
                🟢 Abholbereit
            </div>

        </div>


        <div class="stat-card">

            <div
                class="stat-number"
                id="totalCount"
            >
                0
            </div>

            <div class="stat-label">
                📋 Gesamt
            </div>

        </div>


        <div class="stat-card">

            <div
                class="stat-number"
                id="todayCount"
            >
                0
            </div>

            <div class="stat-label">
                📅 Heute
            </div>

        </div>


        <div class="stat-card">

            <div
                class="stat-number"
                id="openCount"
            >
                0
            </div>

            <div class="stat-label">
                ⏳ Offen
            </div>

        </div>


    </div>



    <!-- =================================================
         BESTELLUNGEN
    ================================================= -->

    <div id="orders">

    </div>

</main>



<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://iezjojbuyzugfguhizyw.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_M-EP4v8yBM092Lkgau701Q_EISGyFfe";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =====================================================
   ELEMENTE
===================================================== */

const loginForm =
    document.getElementById("loginForm");

const loginSection =
    document.getElementById("loginSection");

const adminSection =
    document.getElementById("adminSection");

const loginError =
    document.getElementById("loginError");

const logoutButton =
    document.getElementById("logoutButton");

const refreshButton =
    document.getElementById("refreshButton");

const refreshButtonMobile =
    document.getElementById("refreshButtonMobile");

const loginButton =
    document.getElementById("loginButton");

const ordersContainer =
    document.getElementById("orders");

const orderSearch =
    document.getElementById("orderSearch");

const statusFilter =
    document.getElementById("statusFilter");

const dateFilter =
    document.getElementById("dateFilter");

const lastUpdated =
    document.getElementById("lastUpdated");

const newCount =
    document.getElementById("newCount");

const processingCount =
    document.getElementById("processingCount");

const readyCount =
    document.getElementById("readyCount");

const totalCount =
    document.getElementById("totalCount");

const todayCount =
    document.getElementById("todayCount");

const openCount =
    document.getElementById("openCount");


let allOrders = [];

let realtimeChannel = null;

let isLoadingOrders = false;



/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        loginError.textContent = "";

        loginButton.disabled = true;

        loginButton.textContent =
            "Anmeldung läuft ...";


        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        const {
            error
        } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


        if (error) {

            loginError.textContent =
                "E-Mail oder Passwort ist falsch.";

            console.error(error);

            loginButton.disabled = false;

            loginButton.textContent =
                "Anmelden";

            return;

        }


        loginButton.disabled = false;

        loginButton.textContent =
            "Anmelden";


        await showAdmin();

    }
);



/* =====================================================
   ADMIN ANZEIGEN
===================================================== */

async function showAdmin() {

    loginSection.style.display =
        "none";

    adminSection.style.display =
        "block";

    logoutButton.style.display =
        "block";

    refreshButton.style.display =
        "block";


    await loadOrders();

    startRealtime();

}



/* =====================================================
   BESTELLUNGEN LADEN
===================================================== */

async function loadOrders() {

    if (isLoadingOrders) {

        return;

    }


    isLoadingOrders = true;


    ordersContainer.innerHTML = `

        <div class="loading">

            Vorbestellungen werden geladen ...

        </div>

    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("orders")
        .select("*")
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    isLoadingOrders = false;


    if (error) {

        console.error(error);

        ordersContainer.innerHTML = `

            <div class="error">

                Fehler beim Laden der
                Vorbestellungen.

                <br>

                Bitte versuchen Sie es erneut.

            </div>

        `;

        return;

    }


    allOrders =
        data || [];


    updateDashboardCounts();

    renderOrders();

    updateLastUpdated();

}



/* =====================================================
   DASHBOARD ZAHLEN
===================================================== */

function updateDashboardCounts() {

    const newOrders =
        allOrders.filter(
            function(order) {

                return order.status === "new";

            }
        ).length;


    const processingOrders =
        allOrders.filter(
            function(order) {

                return order.status === "processing";

            }
        ).length;


    const readyOrders =
        allOrders.filter(
            function(order) {

                return order.status === "ready";

            }
        ).length;


    const totalOrders =
        allOrders.length;


    const todayOrders =
        allOrders.filter(
            function(order) {

                return isToday(
                    order.created_at
                );

            }
        ).length;


    const openOrders =
        allOrders.filter(
            function(order) {

                return (
                    order.status !== "completed"
                );

            }
        ).length;


    newCount.textContent =
        newOrders;


    processingCount.textContent =
        processingOrders;


    readyCount.textContent =
        readyOrders;


    totalCount.textContent =
        totalOrders;


    todayCount.textContent =
        todayOrders;


    openCount.textContent =
        openOrders;

}



/* =====================================================
   BESTELLUNGEN DARSTELLEN
===================================================== */

function renderOrders() {

    const searchTerm =
        orderSearch.value
            .toLowerCase()
            .trim();


    const selectedStatus =
        statusFilter.value;


    const selectedDate =
        dateFilter.value;


    const filteredOrders =
        allOrders.filter(
            function(order) {


                const fullText = `

                    ${order.first_name || ""}

                    ${order.last_name || ""}

                    ${order.medicine || ""}

                    ${order.phone || ""}

                    ${order.message || ""}

                `.toLowerCase();


                const matchesSearch =
                    fullText.includes(
                        searchTerm
                    );


                const matchesStatus =
                    selectedStatus === "all"
                    ||
                    order.status === selectedStatus;


                const matchesDate =
                    selectedDate === "all"
                    ||
                    (
                        selectedDate === "today"
                        &&
                        isToday(
                            order.created_at
                        )
                    );


                return (

                    matchesSearch
                    &&
                    matchesStatus
                    &&
                    matchesDate

                );

            }
        );


    if (
        filteredOrders.length === 0
    ) {

        ordersContainer.innerHTML = `

            <div class="empty">

                ${
                    allOrders.length === 0
                    ? "Keine Vorbestellungen vorhanden."
                    : "Keine passenden Vorbestellungen gefunden."
                }

            </div>

        `;

        return;

    }


    ordersContainer.innerHTML = "";


    filteredOrders.forEach(
        function(order) {


            const date =
                formatDate(
                    order.created_at
                );


            const card =
                document.createElement("div");


            card.className =
                "order-card";


            card.innerHTML = `

                <div class="order-header">

                    <div class="order-name">

                        ${escapeHtml(
                            order.first_name
                        )}

                        ${escapeHtml(
                            order.last_name
                        )}

                    </div>


                    <div class="order-date">

                        ${date}

                    </div>

                </div>


                <div class="order-medicine">

                    💊

                    ${escapeHtml(
                        order.medicine
                    )}

                </div>


                <div class="order-details">

                    📞

                    <a
                        href="${getTelLink(
                            order.phone
                        )}"
                    >

                        ${escapeHtml(
                            order.phone
                        )}

                    </a>


                    <br>


                    📝 Nachricht:

                    <div class="order-message">

                        ${escapeHtml(
                            order.message ||
                            "Keine Nachricht"
                        )}

                    </div>


                    <div style="margin-top:8px;">

                        📱 Rückruf:

                        <strong>

                            ${
                                order.callback
                                ? "Ja"
                                : "Nein"
                            }

                        </strong>

                    </div>

                </div>


                <div class="order-status">

                    <span class="status-label">

                        Status:

                    </span>


                    <span>

                        ${getStatusLabel(
                            order.status
                        )}

                    </span>

                </div>


                <div class="status-buttons">


                    <button
                        type="button"
                        class="${
                            order.status === "new"
                            ? "active"
                            : ""
                        }"
                        data-order-id="${order.id}"
                        data-status="new"
                    >

                        🔴 Neu

                    </button>


                    <button
                        type="button"
                        class="${
                            order.status === "processing"
                            ? "active"
                            : ""
                        }"
                        data-order-id="${order.id}"
                        data-status="processing"
                    >

                        🟡 In Bearbeitung

                    </button>


                    <button
                        type="button"
                        class="${
                            order.status === "ready"
                            ? "active"
                            : ""
                        }"
                        data-order-id="${order.id}"
                        data-status="ready"
                    >

                        🟢 Abholbereit

                    </button>


                    <button
                        type="button"
                        class="${
                            order.status === "completed"
                            ? "active"
                            : ""
                        }"
                        data-order-id="${order.id}"
                        data-status="completed"
                    >

                        ⚪ Erledigt

                    </button>


                </div>

            `;


            ordersContainer.appendChild(
                card
            );

        }
    );

}



/* =====================================================
   STATUS-BUTTONS
===================================================== */

ordersContainer.addEventListener(
    "click",
    async function(event) {

        const button =
            event.target.closest(
                "button[data-order-id]"
            );


        if (!button) {

            return;

        }


        const orderId =
            button.dataset.orderId;

        const newStatus =
            button.dataset.status;


        await updateOrderStatus(
            orderId,
            newStatus,
            button
        );

    }
);



/* =====================================================
   STATUS ÄNDERN
===================================================== */

async function updateOrderStatus(
    orderId,
    newStatus,
    clickedButton
) {

    const order =
        allOrders.find(
            function(item) {

                return String(item.id) ===
                    String(orderId);

            }
        );


    if (!order) {

        return;

    }


    if (
        order.status === newStatus
    ) {

        return;

    }


    const originalText =
        clickedButton.textContent;


    clickedButton.disabled =
        true;

    clickedButton.textContent =
        "Speichern ...";


    const {
        error
    } =
    await supabaseClient
        .from("orders")
        .update({

            status: newStatus

        })
        .eq(
            "id",
            orderId
        );


    clickedButton.disabled =
        false;

    clickedButton.textContent =
        originalText;


    if (error) {

        console.error(error);

        showToast(
            "Der Status konnte nicht geändert werden."
        );

        return;

    }


    order.status =
        newStatus;


    updateDashboardCounts();

    renderOrders();

    updateLastUpdated();

    showToast(
        "Status erfolgreich geändert."
    );

}



/* =====================================================
   SICHERHEIT
===================================================== */

function escapeHtml(value) {

    const div =
        document.createElement("div");


    div.textContent =
        value ?? "";


    return div.innerHTML;

}



/* =====================================================
   TELEFONNUMMER
===================================================== */

function getTelLink(phone) {

    if (!phone) {

        return "#";

    }


    const cleaned =
        String(phone)
            .replace(
                /[^0-9+]/g,
                ""
            );


    return "tel:" +
        encodeURIComponent(
            cleaned
        );

}



/* =====================================================
   DATUM FORMATIEREN
===================================================== */

function formatDate(value) {

    if (!value) {

        return "Zeitpunkt unbekannt";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "Zeitpunkt unbekannt";

    }


    return date.toLocaleString(
        "de-DE",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}



/* =====================================================
   HEUTE PRÜFEN
===================================================== */

function isToday(value) {

    if (!value) {

        return false;

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return false;

    }


    const now =
        new Date();


    return (
        date.getFullYear() ===
            now.getFullYear()

        &&

        date.getMonth() ===
            now.getMonth()

        &&

        date.getDate() ===
            now.getDate()
    );

}



/* =====================================================
   STATUS ANZEIGEN
===================================================== */

function getStatusLabel(status) {

    if (status === "new") {

        return "🔴 Neu";

    }


    if (status === "processing") {

        return "🟡 In Bearbeitung";

    }


    if (status === "ready") {

        return "🟢 Abholbereit";

    }


    if (status === "completed") {

        return "⚪ Erledigt";

    }


    return "Unbekannt";

}



/* =====================================================
   LETZTE AKTUALISIERUNG
===================================================== */

function updateLastUpdated() {

    const now =
        new Date();


    lastUpdated.textContent =
        "Zuletzt aktualisiert: " +
        now.toLocaleTimeString(
            "de-DE",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );

}



/* =====================================================
   MANUELLES AKTUALISIEREN
===================================================== */

async function manualRefresh() {

    if (
        isLoadingOrders
    ) {

        return;

    }


    refreshButton.classList.add(
        "loading"
    );


    refreshButtonMobile.classList.add(
        "loading"
    );


    await loadOrders();


    refreshButton.classList.remove(
        "loading"
    );


    refreshButtonMobile.classList.remove(
        "loading"
    );


    showToast(
        "Vorbestellungen aktualisiert."
    );

}


refreshButton.addEventListener(
    "click",
    manualRefresh
);


refreshButtonMobile.addEventListener(
    "click",
    manualRefresh
);



/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
    "click",
    async function() {


        if (realtimeChannel) {

            await supabaseClient.removeChannel(
                realtimeChannel
            );

            realtimeChannel = null;

        }


        await supabaseClient.auth.signOut();


        allOrders = [];


        adminSection.style.display =
            "none";


        loginSection.style.display =
            "block";


        logoutButton.style.display =
            "none";


        refreshButton.style.display =
            "none";


        ordersContainer.innerHTML =
            "";


        orderSearch.value =
            "";


        statusFilter.value =
            "all";


        dateFilter.value =
            "all";


        updateDashboardCounts();

        lastUpdated.textContent =
            "Noch nicht aktualisiert";

    }
);



/* =====================================================
   BESTEHENDE SESSION PRÜFEN
===================================================== */

async function checkSession() {

    const {
        data,
        error
    } =
    await supabaseClient.auth.getUser();


    if (error) {

        console.log(
            "Keine aktive Sitzung."
        );

        return;

    }


    if (data.user) {

        await showAdmin();

    }

}


checkSession();



/* =====================================================
   SUPABASE REALTIME
===================================================== */

function startRealtime() {

    if (realtimeChannel) {

        return;

    }


    realtimeChannel =
        supabaseClient
            .channel(
                "orders-realtime"
            )

            /* =========================================
               NEUE BESTELLUNG
            ========================================= */

            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "orders"
                },

                function(payload) {

                    console.log(
                        "Neue Vorbestellung:",
                        payload.new
                    );


                    loadOrders();


                    showNewOrderNotification(
                        payload.new
                    );

                }
            )

            /* =========================================
               STATUSÄNDERUNG
            ========================================= */

            .on(
                "postgres_changes",
                {
                    event: "UPDATE",
                    schema: "public",
                    table: "orders"
                },

                function(payload) {

                    console.log(
                        "Vorbestellung aktualisiert:",
                        payload.new
                    );


                    loadOrders();

                }
            )

            .subscribe(
                function(status) {

                    console.log(
                        "Realtime Status:",
                        status
                    );

                }
            );

}



/* =====================================================
   NEUE VORBESTELLUNG BENACHRICHTIGUNG
===================================================== */

function showNewOrderNotification(
    order
) {

    const oldNotification =
        document.querySelector(
            ".notification"
        );


    if (
        oldNotification
    ) {

        oldNotification.remove();

    }


    const notification =
        document.createElement("div");


    notification.className =
        "notification";


    notification.innerHTML = `

        <div class="notification-title">

            🔴 Neue Vorbestellung

        </div>


        <div class="notification-name">

            ${escapeHtml(
                order.first_name
            )}

            ${escapeHtml(
                order.last_name
            )}

            <br>

            💊

            ${escapeHtml(
                order.medicine
            )}

        </div>

    `;


    document.body.appendChild(
        notification
    );


    setTimeout(
        function() {

            if (
                notification.parentNode
            ) {

                notification.remove();

            }

        },
        5000
    );

}



/* =====================================================
   TOAST
===================================================== */

function showToast(message) {

    const existingToast =
        document.querySelector(
            ".toast"
        );


    if (
        existingToast
    ) {

        existingToast.remove();

    }


    const toast =
        document.createElement("div");


    toast.className =
        "toast";


    toast.textContent =
        message;


    document.body.appendChild(
        toast
    );


    setTimeout(
        function() {

            if (
                toast.parentNode
            ) {

                toast.remove();

            }

        },
        3000
    );

}
